<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Investment Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { 
            -webkit-appearance: none; margin: 0; 
        }
    </style>
</head>
<body class="bg-slate-900 text-white min-h-screen flex justify-center">
    
    <div class="w-full max-w-md p-6 pb-20">
        <!-- Header & Title -->
        <div class="mb-8 mt-4">
            <input type="text" id="appTitle" value="Track Portfolio And Asset Updates" 
                class="bg-transparent text-2xl font-semibold w-full outline-none focus:border-b border-slate-500 pb-1"
                onchange="saveData()">
        </div>

        <!-- Net Worth Display -->
        <div class="mb-8">
            <div class="flex items-center gap-2 mb-1">
                <p class="text-slate-400 text-sm font-medium">Net Worth (IDR)</p>
                <!-- Ikon Mata (Toggle Visibility) -->
                <button onclick="toggleVisibility()" class="text-slate-400 hover:text-white transition focus:outline-none" id="eyeIconContainer">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
                    </svg>
                </button>
            </div>
            <h1 class="text-4xl font-bold tracking-tight text-white" id="netWorthDisplay">0</h1>
        </div>

        <!-- ASSET CARDS -->
        <div class="space-y-4">
            
            <!-- 1. Investasi Emas -->
            <div class="bg-slate-800 p-5 rounded-2xl shadow-lg border border-slate-700">
                <div class="flex justify-between items-start mb-2">
                    <div>
                        <h2 class="font-semibold text-lg">Investasi Emas</h2>
                        <p class="text-xs text-slate-400 mt-1">Harga Jual Pegadaian: Rp2.445.000/gr</p>
                    </div>
                    <div class="text-right">
                        <h3 class="font-bold text-lg text-emerald-400" id="goldTotalDisplay">0</h3>
                    </div>
                </div>
                <div class="mt-4 flex items-center bg-slate-900 rounded-lg p-2 border border-slate-700">
                    <span class="text-sm text-slate-400 px-2">Total Gram:</span>
                    <input type="number" id="goldGrams" value="0" step="0.01"
                        class="bg-transparent text-right w-full outline-none font-semibold text-white"
                        oninput="calculateTotals()">
                    <span class="text-sm text-slate-400 px-2">gr</span>
                </div>
            </div>

            <!-- 2. Investasi Reksadana -->
            <div class="bg-slate-800 p-5 rounded-2xl shadow-lg border border-slate-700">
                <div class="flex justify-between items-start mb-2">
                    <div>
                        <h2 class="font-semibold text-lg">Reksadana Pasar Uang</h2>
                        <p class="text-xs text-slate-400 mt-1">Portofolio Likuid</p>
                    </div>
                    <div class="text-right">
                        <h3 class="font-bold text-lg text-blue-400" id="reksaTotalDisplay">0</h3>
                    </div>
                </div>
                <div class="mt-4 flex items-center bg-slate-900 rounded-lg p-2 border border-slate-700">
                    <span class="text-sm text-slate-400 px-2">Rp</span>
                    <input type="number" id="reksaValue" value="0"
                        class="bg-transparent text-right w-full outline-none font-semibold text-white"
                        oninput="calculateTotals()">
                </div>
            </div>

            <!-- 3. Investasi Saham -->
            <div class="bg-slate-800 p-5 rounded-2xl shadow-lg border border-slate-700">
                <div class="flex justify-between items-start mb-4">
                    <div>
                        <h2 class="font-semibold text-lg">Investasi Saham (IDX)</h2>
                        <p class="text-xs text-slate-400 mt-1">1 Lot = 100 Lembar</p>
                    </div>
                    <div class="text-right">
                        <h3 class="font-bold text-lg text-purple-400" id="sahamTotalDisplay">0</h3>
                    </div>
                </div>
                
                <!-- Kontainer Daftar Saham -->
                <div id="stockContainer" class="space-y-3">
                    <!-- Saham dirender di sini via JS -->
                </div>

                <!-- Tombol Tambah Saham -->
                <button onclick="addStock()" class="mt-4 text-sm font-medium text-purple-400 hover:text-purple-300 flex items-center w-full justify-center bg-slate-900 py-2 rounded-lg border border-slate-700 border-dashed transition">
                    + Tambah Aset Saham
                </button>
            </div>

        </div>
    </div>

    <!-- LOGIKA JAVASCRIPT -->
    <script>
        const GOLD_PRICE_PER_GRAM = 2445000;
        
        let stocks = [
            { id: 1, name: 'BBRI', price: 4900, lot: 10 },
            { id: 2, name: 'BBCA', price: 10400, lot: 5 }
        ];

        // State untuk fitur mode privasi
        let isVisible = true;

        const iconOpen = `<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>`;
        const iconClosed = `<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"></path></svg>`;

        function toggleVisibility() {
            isVisible = !isVisible;
            
            // Ubah Ikon
            document.getElementById('eyeIconContainer').innerHTML = isVisible ? iconOpen : iconClosed;
            
            // Ubah tipe input form statis (emas & reksa) 
            const inputType = isVisible ? 'number' : 'password';
            document.getElementById('goldGrams').type = inputType;
            document.getElementById('reksaValue').type = inputType;

            // Render ulang komponen saham & total angka
            renderStocks();
            calculateTotals();
        }

        function formatRupiah(number) {
            return new Intl.NumberFormat('id-ID').format(number);
        }

        // Fungsi render data saham
        function renderStocks() {
            const container = document.getElementById('stockContainer');
            container.innerHTML = '';
            
            const inputType = isVisible ? 'number' : 'password';

            stocks.forEach(stock => {
                const totalRupiah = (stock.price || 0) * (stock.lot || 0) * 100;
                const displayTotal = isVisible ? `Rp ${formatRupiah(totalRupiah)}` : '••••••';

                const div = document.createElement('div');
                div.className = 'bg-slate-900 rounded-xl p-3 border border-slate-700';
                
                div.innerHTML = `
                    <div class="flex justify-between items-center mb-3">
                        <input type="text" value="${stock.name}" 
                            oninput="updateStockData(${stock.id}, 'name', this.value)" 
                            placeholder="KODE"
                            class="bg-transparent font-bold text-slate-200 uppercase w-24 outline-none border-b border-slate-600 focus:border-purple-400">
                        <button onclick="removeStock(${stock.id})" class="text-slate-500 hover:text-red-400 text-lg font-bold px-2">&times;</button>
                    </div>
                    
                    <div class="flex gap-3 mb-2">
                        <div class="flex-1">
                            <label class="block text-[10px] text-slate-500 mb-1">Harga/Lembar (Rp)</label>
                            <input type="${inputType}" value="${stock.price || ''}" 
                                oninput="updateStockData(${stock.id}, 'price', this.value)" 
                                placeholder="0"
                                class="w-full bg-slate-800 rounded p-1.5 text-sm text-right text-white outline-none focus:ring-1 focus:ring-slate-500">
                        </div>
                        <div class="w-20">
                            <label class="block text-[10px] text-slate-500 mb-1">Jml Lot</label>
                            <input type="${inputType}" value="${stock.lot || ''}" 
                                oninput="updateStockData(${stock.id}, 'lot', this.value)" 
                                placeholder="0"
                                class="w-full bg-slate-800 rounded p-1.5 text-sm text-right text-white outline-none focus:ring-1 focus:ring-slate-500">
                        </div>
                    </div>
                    
                    <div class="text-right text-sm font-semibold text-purple-300 mt-1">
                        ${displayTotal}
                    </div>
                `;
                container.appendChild(div);
            });
            
            // Panggil calculateTotals agar data atas juga ikut direfresh
            calculateTotals();
        }

        function updateStockData(id, field, value) {
            const stock = stocks.find(s => s.id === id);
            if (stock) {
                if (field === 'name') {
                    stock.name = value;
                } else {
                    stock[field] = parseFloat(value) || 0;
                }
            }
            if (field !== 'name') {
                renderStocks(); 
            } else {
                saveData(); 
            }
        }

        function addStock() {
            stocks.push({ id: Date.now(), name: 'KODE', price: 0, lot: 0 });
            renderStocks();
            saveData();
        }

        function removeStock(id) {
            stocks = stocks.filter(s => s.id !== id);
            renderStocks();
            saveData();
        }

        // Kalkulasi dan sensor angka total 
        function calculateTotals() {
            const goldGrams = parseFloat(document.getElementById('goldGrams').value) || 0;
            const goldTotal = goldGrams * GOLD_PRICE_PER_GRAM;
            document.getElementById('goldTotalDisplay').innerText = isVisible ? formatRupiah(goldTotal) : '••••••';

            const reksaValue = parseFloat(document.getElementById('reksaValue').value) || 0;
            document.getElementById('reksaTotalDisplay').innerText = isVisible ? formatRupiah(reksaValue) : '••••••';

            const sahamTotal = stocks.reduce((sum, stock) => sum + ((stock.price || 0) * (stock.lot || 0) * 100), 0);
            document.getElementById('sahamTotalDisplay').innerText = isVisible ? formatRupiah(sahamTotal) : '••••••';

            const netWorth = goldTotal + reksaValue + sahamTotal;
            // Sensor khusus Total Kekayaan dengan digit titik yang lebih panjang
            document.getElementById('netWorthDisplay').innerText = isVisible ? formatRupiah(netWorth) : '••••••••••';

            saveData();
        }

        function saveData() {
            const data = {
                title: document.getElementById('appTitle').value,
                gold: document.getElementById('goldGrams').value,
                reksa: document.getElementById('reksaValue').value,
                stocksData: stocks
            };
            localStorage.setItem('investmentDataV6', JSON.stringify(data));
        }

        function loadData() {
            const savedData = localStorage.getItem('investmentDataV6');
            if (savedData) {
                const data = JSON.parse(savedData);
                document.getElementById('appTitle').value = data.title || "Track Portfolio And Asset Updates";
                document.getElementById('goldGrams').value = data.gold || 0;
                document.getElementById('reksaValue').value = data.reksa || 0;
                
                if(data.stocksData && Array.isArray(data.stocksData) && data.stocksData.length > 0) {
                    stocks = data.stocksData;
                }
            }
            renderStocks(); 
        }

        window.onload = loadData;
    </script>
</body>
</html>
