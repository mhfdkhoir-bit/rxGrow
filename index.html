<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Investment Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        /* Menghilangkan panah atas/bawah bawaan browser pada input number */
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { 
            -webkit-appearance: none; margin: 0; 
        }
        /* Style untuk input PIN agar terlihat estetik */
        .pin-input {
            letter-spacing: 0.3em;
            text-align: center;
        }
    </style>
</head>
<body class="bg-zinc-950 text-zinc-50 min-h-screen flex justify-center selection:bg-indigo-500/30">
    
    <!-- ==================== LAYAR KUNCI (PIN) ==================== -->
    <div id="pinScreen" class="w-full max-w-md p-6 flex flex-col items-center justify-center min-h-screen z-50 bg-zinc-950/95 backdrop-blur-md absolute inset-0">
        
        <div class="bg-zinc-900 p-8 rounded-3xl shadow-[0_8px_30px_rgb(0,0,0,0.8)] border border-zinc-800/60 w-full max-w-[320px] flex flex-col items-center text-center">
            <div class="mb-6 bg-zinc-950 p-4 rounded-full border border-zinc-800 shadow-inner">
                <svg class="w-8 h-8 text-indigo-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
                </svg>
            </div>
            
            <h2 id="pinTitle" class="text-lg font-bold mb-2 text-zinc-100">Verifikasi Keamanan</h2>
            <p id="pinSubtitle" class="text-xs text-zinc-400 mb-6">Masukkan PIN Anda</p>
            
            <!-- Kolom Input PIN dengan Ikon Mata (ANTI TYPO) -->
            <div class="relative w-3/4">
                <input type="password" id="pinInput" inputmode="numeric" pattern="[0-9]*" maxlength="4" 
                    class="pin-input bg-zinc-950 border border-zinc-700 text-zinc-100 text-2xl rounded-xl p-3 w-full outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition-all shadow-inner"
                    placeholder="••••">
                <button onclick="togglePinEye()" class="absolute inset-y-0 right-3 flex items-center text-zinc-500 hover:text-zinc-300 focus:outline-none" id="pinEyeBtn">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"></path></svg>
                </button>
            </div>
            
            <p id="pinError" class="text-rose-500 text-xs mt-3 h-4"></p>
            
            <button id="pinBtn" class="mt-4 w-full bg-indigo-600 hover:bg-indigo-500 text-white font-medium tracking-wide py-3 rounded-xl transition-all shadow-lg shadow-indigo-900/20">
                Masuk
            </button>

            <!-- Tombol Darurat Lupa PIN -->
            <button onclick="resetPin()" id="resetPinBtn" class="mt-5 text-[11px] font-medium text-zinc-500 hover:text-rose-400 underline transition-colors hidden">
                Lupa PIN? Reset Sekarang
            </button>
        </div>
        
    </div>

    <!-- ==================== APLIKASI UTAMA ==================== -->
    <div id="mainApp" class="w-full max-w-md p-6 pb-20 hidden">
        
        <!-- Header & Title -->
        <div class="mb-8 mt-4">
            <input type="text" id="appTitle" value="Track Portfolio And Asset Updates" 
                class="bg-transparent text-2xl font-semibold w-full outline-none focus:border-b border-zinc-600 pb-1 text-zinc-100"
                onchange="saveData()">
        </div>

        <!-- Net Worth Display -->
        <div class="mb-8">
            <div class="flex items-center gap-2 mb-1">
                <p class="text-zinc-400 text-sm font-medium">Total Aset (IDR)</p>
                <!-- Ikon Mata -->
                <button onclick="toggleVisibility()" class="text-zinc-500 hover:text-zinc-200 transition-colors focus:outline-none" id="eyeIconContainer">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
                </button>
            </div>
            <h1 class="text-4xl font-bold tracking-tight text-white drop-shadow-sm" id="netWorthDisplay">0</h1>
        </div>

        <!-- ASSET CARDS -->
        <div class="space-y-6">
            
            <!-- 1. Investasi Emas -->
            <div class="bg-gradient-to-br from-zinc-900 to-amber-900/50 p-5 rounded-2xl shadow-xl shadow-amber-900/20 border border-amber-500/50">
                <div class="flex justify-between items-start mb-2">
                    <div>
                        <h2 class="font-semibold text-lg text-zinc-100">Emas</h2>
                        <p class="text-[11px] text-zinc-400 mt-1" id="goldPriceLabel">Mengambil data Logamspot...</p>
                    </div>
                    <div class="text-right">
                        <h3 class="font-bold text-lg text-amber-400 drop-shadow-sm" id="goldTotalDisplay">0</h3>
                    </div>
                </div>
                <div class="mt-4 flex items-center bg-zinc-950/80 rounded-xl p-2.5 border border-zinc-800 shadow-inner">
                    <span class="text-sm text-zinc-400 px-2 font-medium">Total Gram:</span>
                    <input type="number" id="goldGrams" value="0" step="0.01" onfocus="this.select()"
                        class="bg-transparent text-right w-full outline-none font-semibold text-zinc-100"
                        oninput="calculateTotals(); saveData();">
                    <span class="text-sm text-zinc-500 px-2">gr</span>
                </div>
            </div>

            <!-- 2. Investasi Reksadana -->
            <div class="bg-gradient-to-br from-zinc-900 to-sky-900/50 p-5 rounded-2xl shadow-xl shadow-sky-900/20 border border-sky-500/50">
                <div class="flex justify-between items-start mb-2">
                    <div>
                        <h2 class="font-semibold text-lg text-zinc-100">Reksadana Pasar Uang</h2>
                        <p class="text-[11px] text-zinc-400 mt-1" id="reksaDateDisplay">Return Update: -</p>
                    </div>
                    <div class="text-right">
                        <h3 class="font-bold text-lg text-sky-400 drop-shadow-sm" id="reksaTotalDisplay">0</h3>
                    </div>
                </div>
                <!-- Pemisahan Modal dan Return -->
                <div class="mt-4 flex gap-3">
                    <div class="flex-1 bg-zinc-950/80 rounded-xl p-2.5 border border-zinc-800 shadow-inner">
                        <label class="block text-[10px] font-medium text-zinc-500 mb-1 px-1">Modal Investasi</label>
                        <div class="flex items-center">
                            <span class="text-sm text-zinc-500 px-1">Rp</span>
                            <input type="number" id="reksaModal" value="0" onfocus="this.select()"
                                class="bg
